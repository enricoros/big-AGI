<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Closed</title>
  <style>
    body {
        margin: 0; padding: 1.5rem 2rem; font: 15px/1.6 system-ui, sans-serif; background: #fff; color: #333;
        p { margin-block: .25em; }
        a { color: #06c; text-decoration: none; } a:hover { text-decoration: underline; }
    }
    .reload { margin-top: 1rem; font-size: 0.8rem;  }
    @media (prefers-color-scheme: dark) {
        body { background: #111; color: #bbb; a { color: #09f; } }
        .reload a { color: #999; }
    }
  </style>
</head>
<body>
  <div>
    <p>Moved to the other window.</p>
    <p>Please close this tab.</p>
    <p class="reload">Or <a href="/">reload</a> here.</p>
  </div>
</body>
</html>
