name: CI

# Type-check (app + tools/tests projects), lint, and test on every push and PR.
# Tests: network tests are key-gated and skip without keys, so `npm test` here
# runs only the offline, deterministic lane.

on:
  push:
    branches: [ main, dev ]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (app, tools, tests)
        run: npm run tsclint

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
